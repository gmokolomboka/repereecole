version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: repereecole-postgres
    environment:
      POSTGRES_DB: repereecole
      POSTGRES_USER: repereecole
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repereecole"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: repereecole-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@repereecole.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
